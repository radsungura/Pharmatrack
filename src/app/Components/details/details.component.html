<div class="details-container">

  <!-- TITLE -->
  <div class="header">
    <h1>{{service.name}}</h1>
    <div class="meta">
      ⭐ {{service.rating}} ({{service.reviews}} avis) • {{service.location}}
    </div>
  </div>

  <!-- IMAGES -->
  <div class="gallery">
    <!-- <img *ngFor="let img of service.images" [src]="img"> -->
    <img  [src]="service.image">
    <img  [src]="service.image">
    <img  [src]="service.image">
  </div>

  <div class="content">

    <!-- DESCRIPTION -->
    <div class="left">

      <h2>Description</h2>
      <p>
        {{service.desc}}
      </p>

      <h2>Services proposés</h2>

      <ul>
        <!-- <li *ngFor="let s of service.services"> -->
        <li>
          ✔ {{service.services}}
        </li>
      </ul>

    </div>

    <!-- BOOKING BOX -->
    <div class="right">

      <div class="booking-card">

        <h3>{{service.price}} Fbu / événement</h3>

        <button class="btn-contact">
          Contacter le prestataire
        </button>

        <button class="btn-reserve">
          Réserver
        </button>

      </div>

    </div>

  </div>

</div>
