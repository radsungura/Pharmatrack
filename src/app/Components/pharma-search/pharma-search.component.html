<button class="back-button" (click)="goBack()">Back</button>
<div class="main">
    <h2>client search</h2>
    <input type="text" [(ngModel)]="searchQuery" 
    (input)="searchPharmacies()" 
    placeholder="client name..."
        class="search-input" />
    <div *ngIf="searchQuery" class="search-container">
        <div *ngIf="isLoading" class="loading-spinner">
            <p>Chargement...</p>
        </div>

        <div *ngIf="search.length > 0">
            <!-- <h3>Résultats :</h3> -->
            <ul>
                <li *ngFor="let client of search" (click)="details(client)">
                    <h4>{{ client.name }}</h4>
                    <!-- <p>{{ client.address }}</p> -->
                </li>
            </ul>
        </div>

        <div *ngIf="search.length === 0 && !isLoading">
            <p>No client found.</p>
        </div>
    </div>
    <div class="list">
        <div *ngIf="pharmacies.length > 0">
            <!-- <h3>Résultats :</h3> -->
            <ul>
                <li *ngFor="let client of pharmacies" (click)="details(client)">
                    <span class="img">🏥</span>
                    <span>
                        <h4>{{ client.name }}</h4>
                        <p>{{ client.address }}</p>
                    </span>
                </li>
            </ul>
        </div>
    </div>
</div>
